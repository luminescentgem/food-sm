doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        # One mapping per module. Domain classes stay plain PHP;
        # the XML mapping lives in each module's Infrastructure layer.
        # File naming: <ShortClassName>.orm.xml (e.g. Ingredient.orm.xml)
        mappings:
            TasteCollection:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/TasteCollection/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\TasteCollection\Domain\Model'
                alias: TasteCollection
            Social:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Social/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Social\Domain\Model'
                alias: Social

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
