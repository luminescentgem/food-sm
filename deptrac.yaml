deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*Kernel\.php$#'

    # Rules, in short:
    #   - Inside a module: Domain → nothing; Application → Domain; Infrastructure → everything of its own module.
    #   - Across modules: the ONLY importable part of a module is <Module>/Api (its published contract),
    #     and only from another module's Application or Infrastructure, never from its Domain.
    #   - Api itself depends on Shared.Domain only, so no internal type can leak through the contract.
    #   - Shared.Domain is importable by everyone and imports nothing.
    #   - Symfony and Doctrine (Framework) only in Infrastructure layers.

    layers:
        # --- Shared ---
        - name: Shared.Domain
          collectors:
              - type: directory
                value: src/Shared/Domain/.*
        - name: Shared.Infrastructure
          collectors:
              - type: directory
                value: src/Shared/Infrastructure/.*

        # --- Identity: owns users ---
        - name: Identity.Api
          collectors:
              - type: directory
                value: src/Identity/Api/.*
        - name: Identity.Domain
          collectors:
              - type: directory
                value: src/Identity/Domain/.*
        - name: Identity.Application
          collectors:
              - type: directory
                value: src/Identity/Application/.*
        - name: Identity.Infrastructure
          collectors:
              - type: directory
                value: src/Identity/Infrastructure/.*

        # --- TasteCollection: owns ingredients, preparations, variants, taste judgments ---
        - name: TasteCollection.Api
          collectors:
              - type: directory
                value: src/TasteCollection/Api/.*
        - name: TasteCollection.Domain
          collectors:
              - type: directory
                value: src/TasteCollection/Domain/.*
        - name: TasteCollection.Application
          collectors:
              - type: directory
                value: src/TasteCollection/Application/.*
        - name: TasteCollection.Infrastructure
          collectors:
              - type: directory
                value: src/TasteCollection/Infrastructure/.*

        # --- Social: viewing and comparing profiles ---
        - name: Social.Api
          collectors:
              - type: directory
                value: src/Social/Api/.*
        - name: Social.Domain
          collectors:
              - type: directory
                value: src/Social/Domain/.*
        - name: Social.Application
          collectors:
              - type: directory
                value: src/Social/Application/.*
        - name: Social.Infrastructure
          collectors:
              - type: directory
                value: src/Social/Infrastructure/.*

        # --- Frameworks (vendor): only Infrastructure may touch them ---
        - name: Framework
          collectors:
              - type: classLike
                value: '^(Symfony|Doctrine)\\.*'

    ruleset:
        Shared.Domain: ~
        Shared.Infrastructure: [Shared.Domain, Framework]

        Identity.Api: [Shared.Domain]
        Identity.Domain: [Shared.Domain]
        Identity.Application: [Identity.Domain, Identity.Api, Shared.Domain, TasteCollection.Api, Social.Api]
        Identity.Infrastructure: [Identity.Application, Identity.Domain, Identity.Api, Shared.Domain, Shared.Infrastructure, Framework, TasteCollection.Api, Social.Api]

        TasteCollection.Api: [Shared.Domain]
        TasteCollection.Domain: [Shared.Domain]
        TasteCollection.Application: [TasteCollection.Domain, TasteCollection.Api, Shared.Domain, Identity.Api, Social.Api]
        TasteCollection.Infrastructure: [TasteCollection.Application, TasteCollection.Domain, TasteCollection.Api, Shared.Domain, Shared.Infrastructure, Framework, Identity.Api, Social.Api]

        Social.Api: [Shared.Domain]
        Social.Domain: [Shared.Domain]
        Social.Application: [Social.Domain, Social.Api, Shared.Domain, Identity.Api, TasteCollection.Api]
        Social.Infrastructure: [Social.Application, Social.Domain, Social.Api, Shared.Domain, Shared.Infrastructure, Framework, Identity.Api, TasteCollection.Api]
