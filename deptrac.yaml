deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*Kernel\.php$#'

    layers:
        # --- Shared kernel: generic value objects only (UserId, ...) ---
        - name: Shared
          collectors:
              - type: directory
                value: src/Shared/.*

        # --- Identity: owns users ---
        - name: Identity.Domain
          collectors:
              - type: directory
                value: src/Identity/Domain/.*
        - name: Identity.Application
          collectors:
              - type: directory
                value: src/Identity/Application/.*
        - name: Identity.Infrastructure
          collectors:
              - type: directory
                value: src/Identity/Infrastructure/.*

        # --- TasteCollection ---
        - name: TasteCollection.Domain
          collectors:
              - type: directory
                value: src/TasteCollection/Domain/.*
        - name: TasteCollection.Application
          collectors:
              - type: directory
                value: src/TasteCollection/Application/.*
        - name: TasteCollection.Infrastructure
          collectors:
              - type: directory
                value: src/TasteCollection/Infrastructure/.*

        # --- Social ---
        - name: Social.Domain
          collectors:
              - type: directory
                value: src/Social/Domain/.*
        - name: Social.Application
          collectors:
              - type: directory
                value: src/Social/Application/.*
        - name: Social.Infrastructure
          collectors:
              - type: directory
                value: src/Social/Infrastructure/.*

        # --- Frameworks (vendor): only Infrastructure may touch them ---
        - name: Framework
          collectors:
              - type: classLike
                value: '^(Symfony|Doctrine)\\.*'

    ruleset:
        Shared: ~

        Identity.Domain: [Shared]
        Identity.Application: [Identity.Domain, Shared]
        Identity.Infrastructure: [Identity.Application, Identity.Domain, Shared, Framework]

        TasteCollection.Domain: [Shared]
        TasteCollection.Application: [TasteCollection.Domain, Shared]
        TasteCollection.Infrastructure: [TasteCollection.Application, TasteCollection.Domain, Shared, Framework]

        Social.Domain: [Shared]
        # Cross-module edges: Social's Application layer calls TasteCollection's and Identity's APIs.
        Social.Application: [Social.Domain, Shared, TasteCollection.Application, Identity.Application]
        Social.Infrastructure: [Social.Application, Social.Domain, Shared, Framework]
